[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchos"
version = "0.1.0"
description = "ResearchOS — a Research Operating System for AI/ML science: structured research state, traceable evidence, audited claims, compiled papers, evolving skills."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ResearchOS contributors" }]
keywords = ["research", "ai-for-science", "provenance", "reproducibility", "evidence", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering",
]

# Deterministic core deliberately has a tiny dependency surface.
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
llm = ["httpx>=0.27"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pypdf>=4.0",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.scripts]
researchos = "researchos.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
researchos = ["templates/**/*.yaml", "templates/**/*.md", "paper/templates/**/*.md", "api/static/*.html", "api/static/*.css", "api/static/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "invariant: one of the ten ResearchOS core invariants",
  "network: requires network access (deselected by default with -m 'not network')",
]
filterwarnings = ["error::DeprecationWarning:researchos.*"]

[tool.coverage.run]
source = ["researchos"]
branch = true
