<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchOS — research state</title>
<!--
  The ResearchOS dashboard.

  Three properties are deliberate and load-bearing:

  1. **No build step and no external resources.** One HTML file, inline CSS/JS, no CDN, no npm. A
     research project must be inspectable years from now, offline, without resurrecting a toolchain.
  2. **It is a view, not a source of truth.** Everything rendered here is read from `.researchos/`
     through the read-only JSON API. The dashboard owns no state.
  3. **Write actions are optional and gated.** Decision buttons appear only when the server was started
     with `--enable-actions`; they run as the human principal through the same kernel gate as the CLI.
     Otherwise the UI shows the exact command to run instead, so nothing is a dead end.
-->
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115; --panel: #161a21; --panel-2: #1c2230; --line: #262d3a;
    --fg: #e6e9ef; --muted: #98a2b3; --dim: #6b7688;
    --accent: #7aa2f7; --ok: #7fd18a; --warn: #e8c07d; --bad: #e88b8b; --info: #8cc9d8;
    --idea: #6b7688; --hyp: #7aa2f7; --tested: #e8c07d; --supported: #7fd18a; --robust: #4fb477;
    --weakened: #d8a06a; --rejected: #e07070; --superseded: #5a6375;
    --radius: 10px; --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe3ea;
      --fg: #141821; --muted: #5c6675; --dim: #8b95a5;
      --accent: #2f5fd0; --ok: #1f7a45; --warn: #8a6100; --bad: #b03030; --info: #1d6b7d;
      --idea: #6b7688; --hyp: #2f5fd0; --tested: #8a6100; --supported: #1f7a45; --robust: #15663a;
      --weakened: #925c1f; --rejected: #b03030; --superseded: #7a8290;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  header {
    position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    border-bottom: 1px solid var(--line); padding: 10px 18px;
  }
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; font-size: 15px; }
  .brand span { color: var(--muted); font-weight: 400; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    padding: 3px 8px; border-radius: 999px; font-size: 11.5px; white-space: nowrap;
  }
  .chip b { color: var(--fg); font-weight: 600; }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .chip.act { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  button, select, input[type=text] {
    font: inherit; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer;
  }
  input[type=text] { cursor: text; min-width: 200px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); border-color: var(--accent); }
  main { padding: 16px 18px 60px; max-width: 1560px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .panel {
    grid-column: span 6; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 15px; min-width: 0;
  }
  .panel.wide { grid-column: span 12; }
  .panel.third { grid-column: span 4; }
  .panel.two-thirds { grid-column: span 8; }
  @media (max-width: 1100px) { .panel, .panel.third, .panel.two-thirds { grid-column: span 12; } }
  h2 {
    margin: 0 0 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  h2 .count { color: var(--dim); font-weight: 500; letter-spacing: 0; text-transform: none; }
  h2 .spacer { margin-left: auto; }
  .big { font-size: 15.5px; line-height: 1.45; }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .small { font-size: 12.5px; }
  .tiny { font-size: 11.5px; }
  ul { margin: 6px 0 0; padding-left: 18px; }
  li { margin: 3px 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  .st { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .st.IDEA { color: var(--idea); } .st.HYPOTHESIS { color: var(--hyp); } .st.TESTED { color: var(--tested); }
  .st.SUPPORTED { color: var(--supported); } .st.ROBUST { color: var(--robust); }
  .st.WEAKENED { color: var(--weakened); } .st.REJECTED { color: var(--rejected); }
  .st.SUPERSEDED { color: var(--superseded); text-decoration: line-through; }
  .bar-track { height: 7px; background: var(--panel-2); border-radius: 99px; overflow: hidden; margin: 4px 0 2px; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar-fill.ok { background: var(--ok); } .bar-fill.warn { background: var(--warn); } .bar-fill.bad { background: var(--bad); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .card { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 12px; margin-bottom: 9px; }
  .card:last-child { margin-bottom: 0; }
  .card h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .pill.imported { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, var(--line)); }
  .quote { border-left: 2px solid var(--line); padding-left: 9px; color: var(--muted); }
  .cmd { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--fg); background: var(--panel-2);
         border: 1px dashed var(--line); border-radius: 7px; padding: 6px 8px; margin-top: 6px; user-select: all; }
  .timeline { max-height: 420px; overflow: auto; padding-right: 4px; }
  .tl { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .tl:last-child { border-bottom: none; }
  .phase { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 10px 0 2px; }
  .toast {
    position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: 460px;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 13px; box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none;
  }
  .toast.err { border-left-color: var(--bad); }
  .loading { color: var(--dim); padding: 40px 0; text-align: center; }
  .empty { color: var(--dim); font-size: 12.5px; }
  .warnline { color: var(--warn); font-size: 12.5px; }
  .badline { color: var(--bad); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .bar-line { display: grid; grid-template-columns: 190px 1fr 52px; align-items: center; gap: 10px; font-size: 12.5px; }
  .nosum { font-size: 11.5px; color: var(--dim); margin-top: 6px; font-style: italic; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">ResearchOS <span id="hdr-project"></span></div>
    <div class="chips" id="hdr-chips"></div>
  </div>
</header>

<main>
  <div id="app"><div class="loading">loading research state…</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const ACTIONS_ENABLED = __ACTIONS_ENABLED__;
let DATA = null;
let REFRESH_TIMER = null;

// ---------------------------------------------------------------- helpers
const $ = (sel) => document.querySelector(sel);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));
const shortId = (id) => (id && id.includes("_")) ? id.split("_")[1].slice(-8) : (id || "");
const num = (value, digits = 2) => (typeof value === "number" ? value.toFixed(digits) : "—");
const pct = (value) => (typeof value === "number" ? Math.round(value * 100) + "%" : "—");
const when = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(); };
const barClass = (score) => score >= 0.75 ? "ok" : score >= 0.4 ? "warn" : "bad";

function toast(message, isError) {
  const el = $("#toast");
  el.textContent = message;
  el.className = "toast" + (isError ? " err" : "");
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.style.display = "none"; }, isError ? 9000 : 5000);
}

function panel(title, count, bodyHtml, cls = "", extra = "") {
  const countHtml = (count === null || count === undefined) ? "" : ` <span class="count">${esc(count)}</span>`;
  return `<section class="panel ${cls}"><h2>${esc(title)}${countHtml}<span class="spacer"></span>${extra}</h2>${bodyHtml}</section>`;
}

function cmdBlock(command) {
  return `<code class="cmd">${esc(command)}</code>`;
}

// ---------------------------------------------------------------- header
function renderHeader() {
  const d = DATA.describe || {};
  const counts = d.counts || {};
  const integrity = DATA.integrity || {};
  $("#hdr-project").textContent = d.project ? "· " + d.project : "";
  const chips = [
    `<span class="chip">rev <b>${esc(d.revision)}</b></span>`,
    `<span class="chip ${integrity.ok ? "ok" : "bad"}">integrity <b>${integrity.ok ? "ok" : (integrity.issues || []).length + " issue(s)"}</b></span>`,
    `<span class="chip">event head <b>${esc(integrity.head || "—")}</b></span>`,
    `<span class="chip ${DATA.reviews.length ? "act" : ""}">review queue <b>${DATA.reviews.length}</b></span>`,
    `<span class="chip">claims <b>${counts.claim || 0}</b> · evidence <b>${counts.evidence || 0}</b> · experiments <b>${counts.experiment || 0}</b></span>`,
    `<span class="chip ${ACTIONS_ENABLED ? "act" : ""}">${ACTIONS_ENABLED ? "human actions enabled" : "read-only"}</span>`,
    `<span class="chip" id="stamp">${esc(when(new Date().toISOString()))}</span>`,
  ];
  $("#hdr-chips").innerHTML = chips.join("") +
    `<button id="refresh">refresh</button>` +
    `<button id="auto">auto</button>`;
  $("#refresh").onclick = () => load(true);
  $("#auto").onclick = toggleAuto;
  if (REFRESH_TIMER) $("#auto").classList.add("primary");
}

function toggleAuto() {
  if (REFRESH_TIMER) { clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; }
  else { REFRESH_TIMER = setInterval(() => load(false), 30000); }
  $("#auto").classList.toggle("primary", !!REFRESH_TIMER);
}

// ---------------------------------------------------------------- panels
function coreQuestionPanel() {
  const q = DATA.core_question;
  const statement = q ? q.statement : "(no core question set)";
  const flags = [];
  if (q && q.is_placeholder) flags.push(`<div class="warnline">unconfirmed placeholder — guarded state changes only through an approved state transition request</div>`);
  if (q && q.scope) flags.push(`<div class="small muted">scope: ${esc(q.scope)}</div>`);
  const frontier = DATA.frontier || {};
  const integrity = DATA.integrity || {};
  const issues = (integrity.issues || []).slice(0, 6);
  return panel("Core question", null,
    `<div class="big">${esc(statement)}</div>${flags.join("")}` +
    (frontier.statement ? `<div class="small muted" style="margin-top:8px">frontier: ${esc(frontier.statement)}</div>` : "") +
    (issues.length ? `<details style="margin-top:8px"><summary>${issues.length} integrity issue(s)</summary><ul class="small">${issues.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></details>` : ""),
    "wide");
}

function claimsPanel() {
  const claims = DATA.claims || [];
  const summary = DATA.claims_summary || {};
  const byStatus = summary.by_status || {};
  const distribution = Object.entries(byStatus).filter(([, v]) => v).map(([k, v]) => `<span class="st ${esc(k)}">${esc(k)} ${v}</span>`).join(" ");
  const live = claims.filter((c) => !["REJECTED", "SUPERSEDED"].includes(c.status));
  const rejected = claims.filter((c) => ["REJECTED", "SUPERSEDED"].includes(c.status));
  const rows = live.map((c) => `
    <tr>
      <td class="mono">${esc(shortId(c.claim_id))}</td>
      <td><span class="st ${esc(c.status)}">${esc(c.status)}</span></td>
      <td class="mono">${esc(c.evidence_level)}</td>
      <td class="tiny muted">${esc(c.language_strength || "—")}</td>
      <td>${esc(c.statement)}</td>
      <td class="tiny muted">${c.hidden_evidence_count} ev · ${esc((c.supporting_experiments || []).length)} exp</td>
    </tr>`).join("");
  const table = live.length
    ? `<table><thead><tr><th>claim</th><th>status</th><th>evidence level</th><th>may say</th><th>statement</th><th>links</th></tr></thead><tbody>${rows}</tbody></table>`
    : `<div class="empty">no live claims. Import a project or propose one with <code>researchos claim propose</code>.</div>`;

  const overclaim = (DATA.overclaiming || []).map((o) => `
    <div class="card">
      <div class="small"><span class="pill">${esc(shortId(o.claim_id))}</span> wording exceeds the evidence</div>
      <div class="small" style="margin-top:5px">now: <span class="quote">${esc(o.statement)}</span></div>
      <div class="small">permitted: <span class="quote">${esc(o.safe)}</span></div>
    </div>`).join("");

  const rejectedHtml = rejected.length
    ? rejected.map((c) => `<div class="card"><div class="row"><span class="st ${esc(c.status)}">${esc(c.status)}</span><span class="tiny muted">retained as a tombstone — never deleted</span></div>
        <div class="small" style="margin-top:4px">${esc(c.statement)}</div>
        <div class="tiny muted">reason: ${esc(c.rejection_reason || "—")}${c.rejection_basis ? " · basis " + esc(c.rejection_basis) : ""}</div></div>`).join("")
    : `<div class="empty">no rejected claims recorded</div>`;

  const omitted = DATA.claims_omitted ? `<div class="tiny dim">${DATA.claims_omitted} further claim(s) not shown</div>` : "";
  return panel("Current claims", claims.length, `<div class="row" style="margin-bottom:8px">${distribution}</div>${table}${omitted}` +
    (overclaim ? `<h2 style="margin-top:14px">Wording above the evidence <span class="count">${(DATA.overclaiming || []).length}</span></h2>${overclaim}` : ""),
    "wide");
}

function rejectedPanel() {
  const rejected = (DATA.claims || []).filter((c) => ["REJECTED", "SUPERSEDED"].includes(c.status));
  const body = rejected.length
    ? rejected.map((c) => `<div class="card"><div class="row"><span class="st ${esc(c.status)}">${esc(c.status)}</span><span class="tiny muted">retained as a tombstone — never deleted</span></div>
        <div class="small" style="margin-top:4px">${esc(c.statement)}</div>
        <div class="tiny muted">reason: ${esc(c.rejection_reason || "—")}${c.rejection_basis ? " · basis " + esc(c.rejection_basis) : ""}</div></div>`).join("")
    : `<div class="empty">none — nothing has been rejected yet</div>`;
  return panel("Rejected claims", rejected.length, body, "third");
}

function tasksPanel() {
  const tasks = DATA.tasks || {};
  const active = tasks.active;
  const render = (t) => `
    <div class="card">
      <div class="row"><span class="pill">${esc(t.priority)}</span><span class="pill">${esc(t.purpose)}</span><span class="st ${esc(t.status)}">${esc(t.status)}</span><span class="mono tiny">${esc(shortId(t.task_id))}</span></div>
      <div class="small" style="margin-top:5px">${esc(t.objective)}</div>
      ${t.stop_condition ? `<div class="tiny muted">stop when: ${esc(t.stop_condition)}</div>` : ""}
      ${(t.forbidden_actions || []).length ? `<div class="tiny muted">forbidden: ${esc(t.forbidden_actions.join(", "))}</div>` : ""}
      ${(t.findings || []).length ? `<ul class="tiny">${t.findings.slice(0, 4).map((f) => `<li>${esc(f.kind)}: ${esc(f.statement)}${f.suggests_core_change ? " <span class=\"warnline\">(suggests core change)</span>" : ""}</li>`).join("")}</ul>` : ""}
    </div>`;
  const queue = (tasks.queue || []).filter((t) => !active || t.task_id !== active.task_id);
  return panel("Active task", null,
    (active ? render(active) : `<div class="empty">no task running. Bounded tasks are how a local problem stays local: <code>researchos task create "…" --purpose DEBUG --priority EXPLORATORY</code></div>`) +
    (queue.length ? `<h2 style="margin-top:12px">Open queue <span class="count">${queue.length}</span></h2>${queue.slice(0, 5).map(render).join("")}` : ""),
    "two-thirds");
}

function evidencePanel() {
  const s = DATA.evidence_summary || {};
  const integrity = DATA.evidence_integrity || {};
  const byType = s.by_type || {};
  const byVerification = s.by_verification || {};
  const byLevel = s.by_level || {};
  const list = (obj) => Object.entries(obj).filter(([, v]) => v).map(([k, v]) => `<span class="pill">${esc(k)} ${v}</span>`).join(" ") || `<span class="empty">none</span>`;
  const mismatches = (integrity.hash_mismatches || []);
  return panel("Evidence coverage", s.total || 0,
    `<div class="kv">
       <div>by maturity</div><div>${list(byType)}</div>
       <div>by verification</div><div>${list(byVerification)}</div>
       <div>by evidence level</div><div>${list(byLevel)}</div>
       <div>immutable raw</div><div>${esc(s.immutable ?? 0)}</div>
       <div>with provenance</div><div>${esc(s.with_provenance ?? 0)}</div>
       <div>unverified</div><div>${esc(s.unverified ?? 0)}</div>
       <div>orphans</div><div>${(integrity.orphans || []).length ? esc(integrity.orphans.slice(0, 5).join(", ")) : "none"}</div>
     </div>` +
    (mismatches.length
      ? `<div class="badline" style="margin-top:8px">${mismatches.length} artifact hash mismatch(es) — those bytes changed after registration, and each one is a blocking conflict</div>`
      : "") +
    (ACTIONS_ENABLED ? `<div class="tiny muted" style="margin-top:8px">Verify an artifact by re-hashing it: <code>POST /actions/evidence/verify</code></div>` : ""),
    "third");
}

function experimentsPanel() {
  const experiments = DATA.experiments || [];
  const body = experiments.length ? experiments.map((e) => {
    const gaps = [];
    if (!e.control) gaps.push("no control arm");
    if (e.control && !(e.matched_conditions || []).length) gaps.push("conditions not shown matched");
    if (!(e.seeds || []).length) gaps.push("no seeds");
    if (e.status === "FAILED" || e.status === "ABORTED") gaps.push("did not complete: " + (e.failure_reason || "no reason recorded"));
    return `<div class="card">
      <div class="row"><span class="pill">${esc(e.status)}</span><span class="pill">ceiling ${esc(e.design_level)}</span><span class="mono tiny">${esc(shortId(e.experiment_id))}</span></div>
      <div class="small" style="margin-top:4px">${esc(e.title)}</div>
      <div class="tiny muted">${esc(e.model || "model?")} · ${esc(e.dataset || "dataset?")} · seeds ${esc((e.seeds || []).join(",") || "—")} · n=${esc(e.n ?? "—")}</div>
      ${(e.matched_conditions || []).length ? `<div class="tiny muted">matched on ${esc(e.matched_conditions.join(", "))}</div>` : ""}
      ${gaps.length ? `<div class="warnline" style="margin-top:4px">${esc(gaps.join("; "))}</div>` : ""}
    </div>`;
  }).join("") : `<div class="empty">no experiments registered</div>`;
  return panel("Current experiments", (DATA.describe.counts || {}).experiment || 0, body, "third");
}

function conflictsPanel() {
  const conflicts = DATA.conflicts || [];
  const summary = DATA.conflicts_summary || {};
  const trust = (DATA.trust_order || []);
  const body = conflicts.length ? conflicts.map((c) => `
    <div class="card">
      <div class="row">
        <span class="pill">${esc(c.kind)}</span>
        <span class="chip ${c.blocks_claim_promotion ? "bad" : ""}">${esc(c.resolution)}</span>
        ${c.blocks_claim_promotion ? `<span class="tiny badline">blocks claim promotion</span>` : ""}
      </div>
      <div class="small" style="margin-top:5px">${esc(c.subject)}</div>
      <div class="tiny" style="margin-top:4px">
        <div>A <span class="muted">${esc(c.source_a.kind)}</span> ${esc(c.source_a.ref)} = <span class="mono">${esc(JSON.stringify(c.source_a.value))}</span></div>
        <div>B <span class="muted">${esc(c.source_b.kind)}</span> ${esc(c.source_b.ref)} = <span class="mono">${esc(JSON.stringify(c.source_b.value))}</span></div>
      </div>
      <div class="tiny muted" style="margin-top:4px">${esc(c.difference)}</div>
      ${c.resolution_reason ? `<div class="tiny muted">resolution: ${esc(c.resolution_reason)}</div>` : ""}
      <div class="tiny dim">both sources retained (diff ${esc(c.conflict_id)})</div>
    </div>`).join("") : `<div class="empty">no conflicts detected</div>`;
  const trustLine = trust.map(([kind, value]) => `<span class="pill">${esc(kind)} ${value}</span>`).join(" › ");
  const counts = Object.entries(summary).filter(([, v]) => v).map(([k, v]) => `<span class="pill">${esc(k)} ${v}</span>`).join(" ");
  return panel("Conflicts", conflicts.length,
    `<div class="small muted">provenance trust order (higher wins; the loser is marked, never deleted):</div>
     <div class="row" style="margin:6px 0 10px">${trustLine}</div>
     <div class="row" style="margin-bottom:10px">${counts}</div>${body}`,
    "two-thirds");
}

function literaturePanel() {
  const lit = DATA.literature || {};
  const coverage = lit.coverage || {};
  const prior = (coverage.closest_prior_work || []);
  const audits = (lit.novelty_audits || []);
  const papers = (lit.papers || []);
  const coverageBar = `<div class="bar-track"><div class="bar-fill ${barClass(coverage.coverage_score || 0)}" style="width:${pct(coverage.coverage_score || 0)}"></div></div>`;
  const auditHtml = audits.length ? audits.map((a) => `
    <div class="card">
      <div class="row"><span class="pill">${esc(a.verdict)}</span><span class="pill">gap: ${esc(a.gap_kind)}</span>
        <span class="tiny ${a.coverage_sufficient ? "muted" : "warnline"}">coverage ${num(a.coverage_score)} ${a.coverage_sufficient ? "(sufficient)" : "(insufficient → verdict forced to uncertain)"}</span></div>
      <div class="small" style="margin-top:4px">${esc(a.target_statement)}</div>
      <div class="tiny muted">safe sentence: ${esc(a.sentence)}</div>
    </div>`).join("") : `<div class="empty">no novelty audit yet — <code>researchos novelty audit "…"</code></div>`;
  return panel("Literature map", lit.paper_count || 0,
    `<div class="kv">
       <div>coverage</div><div>${coverageBar}<span class="tiny muted">${num(coverage.coverage_score)} — ${esc(coverage.basis || "no search executed")}</span></div>
       <div>queries</div><div>${esc(coverage.queries_executed ?? 0)} across ${Object.keys(coverage.terminology_coverage || {}).length || 0} families</div>
       <div>providers</div><div>${esc((coverage.providers_used || []).join(", ") || "none")}</div>
       <div>screened / full text</div><div>${esc(coverage.papers_screened ?? 0)} / ${esc(coverage.fulltext_verified ?? 0)}</div>
     </div>
     <h2 style="margin-top:14px">Closest prior work <span class="count">${prior.length}</span></h2>
     ${prior.length ? `<ul class="small">${prior.map((p) => `<li>${esc(p.title || shortId(p.paper_id))} <span class="tiny muted">(${esc(p.relation)}${p.threat_level ? ", threat " + esc(p.threat_level) : ""})${p.note ? " — " + esc(p.note) : ""}</span></li>`).join("")}</ul>` : `<div class="empty">no prior work recorded</div>`}
     <h2 style="margin-top:14px">Novelty audits <span class="count">${audits.length}</span></h2>${auditHtml}
     <details style="margin-top:10px"><summary>screened papers (${papers.length})</summary>
       <ul class="tiny">${papers.slice(0, 20).map((p) => `<li>${esc(p.year || "n.d.")} · ${esc(p.title)} <span class="muted">[${esc(p.fulltext_status)}]</span></li>`).join("")}</ul>
     </details>`,
    "two-thirds");
}

function questionsPanel() {
  const questions = DATA.questions || [];
  const body = questions.length ? questions.map((q) => `
    <div class="card"><div class="row"><span class="pill">${esc(q.kind)}</span><span class="pill">${esc(q.priority)}</span></div>
      <div class="small" style="margin-top:4px">${esc(q.statement)}</div></div>`).join("")
    : `<div class="empty">no open questions recorded</div>`;
  return panel("Open questions", questions.length, body, "third");
}

function decisionsPanel() {
  const decisions = DATA.decisions || [];
  const body = decisions.length ? decisions.map((d) => `
    <div class="card">
      <div class="row"><span class="pill">${esc(d.kind)}</span><span class="tiny muted">${esc(when(d.created_at))} · by ${esc(d.made_by)}</span></div>
      <div class="small" style="margin-top:4px">${esc(d.summary)}</div>
      <div class="tiny muted">${esc(d.rationale)}</div>
      ${(d.alternatives_considered || []).length ? `<div class="tiny dim">considered: ${esc(d.alternatives_considered.join(" | "))}</div>` : ""}
      ${(d.rejected_alternatives || []).length ? `<div class="tiny dim">rejected: ${esc(d.rejected_alternatives.join(" | "))}</div>` : ""}
    </div>`).join("") : `<div class="empty">no decisions recorded. Direction changes without a decision record are the drift this system prevents.</div>`;
  return panel("Research decisions", decisions.length, body, "two-thirds");
}

function skillsPanel() {
  const skills = DATA.skills || {};
  const health = skills.health || {};
  const cards = (skills.skills || []);
  const gaps = (skills.gaps || []);
  const healthLine = Object.entries(health).filter(([, v]) => typeof v !== "object")
    .map(([k, v]) => `<span class="pill">${esc(k)} ${esc(v)}</span>`).join(" ");
  const body = `
    <div class="row" style="margin-bottom:8px">${healthLine || `<span class="empty">no skills registered</span>`}</div>
    ${cards.length ? `<table><thead><tr><th>skill</th><th>status</th><th>trust</th><th>score</th><th>benchmarked</th></tr></thead><tbody>
      ${cards.map((s) => `<tr><td>${esc(s.name)} <span class="mono tiny dim">${esc(shortId(s.skill_id))}</span></td>
        <td><span class="pill">${esc(s.status)}</span></td><td class="tiny">${esc(s.trust)}</td>
        <td class="mono">${num(s.score)}</td>
        <td class="tiny">${s.last_benchmark_run_id ? "yes" : "no (activation requires a run)"}</td></tr>`).join("")}
    </tbody></table>` : ""}
    <h2 style="margin-top:14px">Skill gaps <span class="count">${gaps.length}</span></h2>
    ${gaps.length ? gaps.map((g) => `<div class="card"><div class="row"><span class="pill">${esc(g.occurrences)}×</span><span class="pill">${esc(g.severity)}</span><span class="tiny muted">${esc(g.status)}</span></div>
      <div class="small" style="margin-top:4px">${esc(g.missing_capability)}</div>
      <div class="tiny muted">${esc(g.description)}</div></div>`).join("") : `<div class="empty">no capability gaps detected</div>`}`;
  return panel("Skill health & gaps", skills.gap_count || gaps.length, body, "third");
}

function readinessPanel() {
  const readiness = DATA.readiness || {};
  const dims = readiness.dimensions || [];
  const body = dims.length ? dims.map((d) => `
    <div class="bar-line">
      <div>${esc(d.label || d.dimension)}</div>
      <div><div class="bar-track"><div class="bar-fill ${barClass(d.score)}" style="width:${pct(d.score)}"></div></div></div>
      <div class="mono">${num(d.score)}</div>
    </div>
    <div class="tiny muted" style="margin:0 0 8px 200px">${esc(d.basis)}${d.hard_blocked ? " · <span class=\"badline\">hard blocked</span>" : ""}${(d.unknowns || []).length ? " · unknown: " + esc(d.unknowns.slice(0, 2).join("; ")) : ""}</div>`).join("")
    : `<div class="empty">readiness unavailable${readiness.error ? ": " + esc(readiness.error) : ""}</div>`;
  const blockers = (readiness.blockers || []);
  return panel("Paper readiness", dims.length,
    body +
    (blockers.length ? `<h2 style="margin-top:12px">Blockers <span class="count">${blockers.length}</span></h2><ul class="small">${blockers.slice(0, 8).map((b) => `<li>${esc(b)}</li>`).join("")}</ul>` : "") +
    `<div class="nosum">No single total score, by design: collapsing seven scientific dimensions into one number is false precision.</div>`,
    "third");
}

function timelinePanel() {
  const timeline = DATA.timeline || {};
  const events = (timeline.events || []);
  const phases = [
    ["observation", ["PROJECT_CREATED", "IMPORT", "IDEA", "LITERATURE"]],
    ["hypothesis", ["TASK_CREATED", "FINDING"]],
    ["experiment", ["EXPERIMENT_REGISTERED", "EXPERIMENT_STARTED", "EXPERIMENT_RESULT", "EXPERIMENT_FAILED", "ANOMALY"]],
    ["analysis", ["ANALYSIS", "EVIDENCE", "VERIFICATION"]],
    ["revision", ["AUDIT", "CLAIM_REVISION", "CLAIM_REJECTED", "STATE_TRANSITION", "DECISION"]],
    ["claim", ["CLAIM_CREATED", "SKILL"]],
    ["paper", ["PAPER"]],
  ];
  const seen = new Set();
  let html = "";
  for (const [phase, kinds] of phases) {
    const bucket = events.filter((e) => kinds.includes(e.kind));
    bucket.forEach((e) => seen.add(e.event_id));
    if (!bucket.length) continue;
    html += `<div class="phase">${esc(phase)} (${bucket.length})</div>` + bucket.slice(0, 14).map((e) => `
      <div class="tl">
        <div class="tiny muted">${esc(when(e.at).split(",")[0])}</div>
        <div class="small">${esc(e.title)} ${e.imported ? `<span class="pill imported">imported</span>` : ""}
          <div class="tiny dim">${esc(e.kind)} · ${esc(e.actor)}${e.detail ? " · " + esc(String(e.detail).slice(0, 120)) : ""}</div>
        </div>
      </div>`).join("");
  }
  const rest = events.filter((e) => !seen.has(e.event_id));
  if (rest.length) html += `<div class="phase">other (${rest.length})</div>` + rest.slice(0, 10).map((e) => `<div class="tl"><div class="tiny muted">${esc(when(e.at).split(",")[0])}</div><div class="small">${esc(e.title)} <span class="tiny dim">${esc(e.kind)}</span></div></div>`).join("");
  const summary = timeline.summary || {};
  return panel("Research timeline", summary.events || events.length,
    `<div class="small muted" style="margin-bottom:8px">The real arc, from records: why the claim was cancelled, the route changed, the control was added. Ask from the CLI with <code>researchos timeline ask --question "…"</code>.</div>
     <div class="timeline">${html || `<div class="empty">no timeline events</div>`}</div>
     ${timeline.omitted ? `<div class="tiny dim">${timeline.omitted} older event(s) not shown</div>` : ""}`,
    "two-thirds");
}

function reviewPanel() {
  const reviews = DATA.reviews || [];
  const body = reviews.length ? reviews.map((r) => {
    const questions = (r.questions_for_human || []);
    const refs = (r.source_refs || []);
    const actions = ACTIONS_ENABLED ? `
      <div class="row" style="margin-top:7px">
        <button class="primary" data-act="ACCEPTED" data-id="${esc(r.review_item_id)}">accept</button>
        <button data-act="REJECTED" data-id="${esc(r.review_item_id)}">reject</button>
        <button data-act="DEFERRED" data-id="${esc(r.review_item_id)}">defer</button>
      </div>` : cmdBlock(`researchos review decide ${r.review_item_id} ACCEPTED --note "确认"`);
    return `<div class="card">
      <div class="row"><span class="pill">${esc(r.kind)}</span><span class="pill">confidence ${num(r.confidence)}</span><span class="pill">${esc(r.severity)}</span>
        <span class="mono tiny dim">${esc(shortId(r.review_item_id))}</span></div>
      <h3 style="margin-top:6px">${esc(r.title)}</h3>
      <div class="small muted">${esc(r.rationale)}</div>
      ${questions.length ? `<ul class="tiny">${questions.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>` : ""}
      ${refs.length ? `<div class="tiny dim">source: ${refs.map((s) => esc(s.path) + (s.locator ? " " + esc(s.locator) : "")).join(", ")}</div>` : ""}
      ${r.extraction_rule ? `<div class="tiny dim">rule: <span class="mono">${esc(r.extraction_rule)}</span></div>` : ""}
      ${actions}
    </div>`;
  }).join("") : `<div class="empty">review queue is empty — everything imported has been decided</div>`;
  const note = ACTIONS_ENABLED
    ? `<span class="tiny muted">decisions run as the human principal through the same kernel gate as the CLI</span>`
    : `<span class="tiny muted">start with <span class="mono">researchos api --enable-actions</span> to decide here</span>`;
  return panel("Human review queue", reviews.length, body, "wide", note);
}

function auditsPanel() {
  const audits = DATA.audits || [];
  const redTeam = DATA.red_team || [];
  const papers = DATA.paper || [];
  const auditRows = audits.length ? `<table><thead><tr><th>audit</th><th>verdict</th><th>findings</th><th>blocking</th><th>when</th></tr></thead><tbody>
      ${audits.map((a) => `<tr><td>${esc(a.kind)} <span class="tiny muted">${esc(a.title.slice(0, 48))}</span></td>
        <td><span class="pill">${esc(a.verdict)}</span></td><td class="mono">${a.findings}</td>
        <td class="mono ${a.blocking ? "badline" : ""}">${a.blocking}</td><td class="tiny muted">${esc(when(a.created_at))}</td></tr>`).join("")}
    </tbody></table>` : `<div class="empty">no audits run yet — <code>researchos audit stats</code>, <code>researchos mechanism</code></div>`;
  const rtHtml = redTeam.length ? `<h2 style="margin-top:14px">Red team <span class="count">${redTeam.length}</span></h2>
    ${redTeam.map((r) => `<div class="card"><div class="row"><span class="pill">${esc(r.verdict)}</span><span class="pill">${r.questions} objection(s)</span>${r.blocking ? `<span class="tiny badline">${r.blocking} high-severity unaddressed</span>` : ""}</div><div class="tiny muted">${esc(r.subject)}</div></div>`).join("")}` : "";
  const paperHtml = papers.length ? `<h2 style="margin-top:14px">Compiled papers <span class="count">${papers.length}</span></h2>
    ${papers.map((p) => `<div class="card"><div class="row"><span class="pill">${p.grounding_passed ? "grounding passed" : "blocked"}</span><span class="tiny muted">${esc(p.words)} words · ${esc(when(p.compiled_at))}</span></div>
      <div class="small" style="margin-top:4px">${esc(p.title.slice(0, 120))}</div>
      ${(p.refusals || []).length ? `<ul class="tiny muted">${p.refusals.map((r) => `<li>refused: ${esc(r)}</li>`).join("")}</ul>` : ""}</div>`).join("")}` : "";
  return panel("Audits, red team & compiled papers", audits.length, auditRows + rtHtml + paperHtml, "two-thirds");
}

// ---------------------------------------------------------------- actions
async function post(path, body) {
  const response = await fetch(path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.detail || ("HTTP " + response.status));
  return payload;
}

function wireActions() {
  document.querySelectorAll("button[data-act]").forEach((button) => {
    button.onclick = async () => {
      const id = button.dataset.id, decision = button.dataset.act;
      const note = decision === "REJECTED" ? (prompt("Why is this rejected? (recorded as the decision note)") || "rejected") : "";
      if (decision === "REJECTED" && !note) return;
      button.disabled = true;
      try {
        const result = await post("/actions/review/decide", { review_item_id: id, decision, note });
        toast(`review ${shortId(id)} → ${result.status}`);
        await load(false);
      } catch (error) {
        toast("action refused: " + error.message, true);
      } finally {
        button.disabled = false;
      }
    };
  });
}

// ---------------------------------------------------------------- render
function render() {
  renderHeader();
  const html = [
    coreQuestionPanel(),
    tasksPanel(),
    evidencePanel(),
    claimsPanel(),
    experimentsPanel(),
    conflictsPanel(),
    literaturePanel(),
    questionsPanel(),
    decisionsPanel(),
    skillsPanel(),
    readinessPanel(),
    timelinePanel(),
    auditsPanel(),
    reviewPanel(),
  ].join("");
  $("#app").innerHTML = `<div class="grid">${html}</div>`;
  if (ACTIONS_ENABLED) wireActions();
}

async function load(showErrors) {
  try {
    const response = await fetch("/dashboard", { headers: { "Accept": "application/json" } });
    if (!response.ok) throw new Error("HTTP " + response.status);
    DATA = await response.json();
    render();
  } catch (error) {
    if (showErrors) toast("could not load /dashboard: " + error.message, true);
    const app = $("#app");
    if (app && app.querySelector(".loading")) {
      app.innerHTML = `<div class="panel wide"><h2>Dashboard unavailable</h2>
        <div class="small muted">The API answered with an error. Check that the project has a valid
        <span class="mono">.researchos/</span> directory and that the server is running for the right root.</div>
        <code class="cmd">researchos api --root &lt;project&gt; --port 8765</code></div>`;
    }
  }
}

if (ACTIONS_ENABLED) {
  fetch("/actions/status").then((r) => r.json()).then((s) => {
    if (s && s.enabled) toast("human actions enabled: review decisions run as the human principal");
  }).catch(() => {});
}
load(true);
</script>
</body>
</html>
