<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResearchOS — research cockpit</title>
<!--
  ResearchOS has two views, and keeping them apart is the point.

  * COCKPIT (default) answers the five questions a researcher opens the tool with: what am I
    researching, what do I know, what can I not trust yet, why can I not continue, what do I do next.
    It contains no revision, no hash, no event head and no skill counters — those answer a different
    question ("is this system trustworthy?") and mixing the two is what made the first version
    unreadable.
  * AUDIT CONSOLE answers that second question: integrity, provenance, hash verification, evidence
    maturity, event log, skill health, import diagnostics, audit history.

  Both views read the same read-only API. Nothing here is a source of truth: `.researchos/` is.
  Write actions are off unless the server was started with `--enable-actions`, and even then they run
  as the human principal through the same kernel gate as the CLI.
-->
<style>
  :root {
    color-scheme: dark light;
    --bg: #0f1115; --panel: #161a21; --panel-2: #1c2230; --line: #262d3a;
    --fg: #e6e9ef; --muted: #98a2b3; --dim: #6b7688;
    --accent: #7aa2f7; --ok: #7fd18a; --warn: #e8c07d; --bad: #e88b8b; --info: #8cc9d8;
    --idea: #6b7688; --hyp: #7aa2f7; --tested: #e8c07d; --supported: #7fd18a; --robust: #4fb477;
    --weakened: #d8a06a; --rejected: #e07070; --superseded: #5a6375;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe3ea;
      --fg: #141821; --muted: #5c6675; --dim: #8b95a5;
      --accent: #2f5fd0; --ok: #1f7a45; --warn: #8a6100; --bad: #b03030; --info: #1d6b7d;
      --idea: #6b7688; --hyp: #2f5fd0; --tested: #8a6100; --supported: #1f7a45; --robust: #15663a;
      --weakened: #925c1f; --rejected: #b03030; --superseded: #7a8290;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  code, .mono { font-family: var(--mono); font-size: 12px; }
  header { position: sticky; top: 0; z-index: 6; backdrop-filter: blur(8px);
    background: color-mix(in srgb, var(--bg) 90%, transparent); border-bottom: 1px solid var(--line); padding: 9px 18px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .brand span { color: var(--muted); font-weight: 400; }
  .switch { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .switch button { border: none; border-radius: 0; background: var(--panel); color: var(--muted); padding: 6px 13px; }
  .switch button.on { background: color-mix(in srgb, var(--accent) 24%, var(--panel)); color: var(--fg); font-weight: 600; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 3px 9px;
    border-radius: 999px; font-size: 11.5px; white-space: nowrap; }
  .chip b { color: var(--fg); font-weight: 600; }
  .chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .chip.act { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
  button, input[type=text] { font: inherit; color: var(--fg); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 11px; cursor: pointer; }
  input[type=text] { cursor: text; min-width: 180px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: color-mix(in srgb, var(--accent) 24%, var(--panel-2)); border-color: var(--accent); font-weight: 600; }
  button.ok { border-color: var(--ok); color: var(--ok); }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  main { padding: 18px; max-width: 1400px; margin: 0 auto 70px; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; }
  .panel { grid-column: span 6; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 15px 17px; min-width: 0; }
  .panel.wide { grid-column: span 12; } .panel.third { grid-column: span 4; }
  .panel.two-thirds { grid-column: span 8; }
  @media (max-width: 1080px) { .panel, .panel.third, .panel.two-thirds { grid-column: span 12; } }
  h2 { margin: 0 0 11px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em;
    color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h2 .count { color: var(--dim); font-weight: 500; letter-spacing: 0; text-transform: none; }
  h2 .spacer { margin-left: auto; }
  .glance { display: grid; grid-template-columns: 180px 1fr; gap: 9px 20px; align-items: baseline; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim); }
  .phase { font-size: 19px; font-weight: 700; letter-spacing: -.2px; }
  .question { font-size: 16.5px; line-height: 1.45; }
  .finding { font-size: 14.5px; color: var(--muted); }
  .muted { color: var(--muted); } .dim { color: var(--dim); }
  .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
  ul { margin: 6px 0 0; padding-left: 18px; } li { margin: 3px 0; }
  .act { display: grid; grid-template-columns: 4px 1fr; gap: 0 13px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 9px; overflow: hidden; }
  .act .sev { background: var(--dim); }
  .act.BLOCKER .sev { background: var(--bad); } .act.HIGH .sev { background: var(--warn); }
  .act.MEDIUM .sev { background: var(--info); } .act.LOW .sev { background: var(--dim); }
  .act .body { padding: 11px 13px 12px 0; }
  .act h3 { margin: 0; font-size: 14px; }
  .act.top { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
  .why { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .blocks { font-size: 11.5px; color: var(--warn); margin-top: 4px; }
  .cmd { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--fg); background: var(--panel);
    border: 1px dashed var(--line); border-radius: 7px; padding: 5px 8px; margin-top: 7px; user-select: all; }
  .chain { display: grid; gap: 8px; }
  .step { display: grid; grid-template-columns: 22px 1fr 64px; align-items: center; gap: 10px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .step.blocked .dot { border-color: var(--bad); color: var(--bad); }
  .step.ok .dot { border-color: var(--ok); color: var(--ok); }
  .step .name { font-size: 13px; } .step .note { font-size: 11.5px; color: var(--dim); }
  .step .n { text-align: right; font-family: var(--mono); font-size: 13px; }
  .bars { display: grid; gap: 6px; margin-top: 4px; }
  .bar-line { display: grid; grid-template-columns: 148px 1fr 44px; align-items: center; gap: 10px; font-size: 12.5px; }
  .bar-track { height: 7px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 99px; }
  .bar-fill.ok { background: var(--ok); } .bar-fill.warn { background: var(--warn); } .bar-fill.bad { background: var(--bad); }
  .st { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .st.IDEA { color: var(--idea); } .st.HYPOTHESIS { color: var(--hyp); } .st.TESTED { color: var(--tested); }
  .st.SUPPORTED { color: var(--supported); } .st.ROBUST { color: var(--robust); }
  .st.WEAKENED { color: var(--weakened); } .st.REJECTED { color: var(--rejected); }
  .st.SUPERSEDED { color: var(--superseded); text-decoration: line-through; }
  .st.PENDING { color: var(--tested); } .st.done { color: var(--ok); } .st.current { color: var(--warn); }
  .st.pending { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; }
  tr:last-child td { border-bottom: none; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12.5px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .card { border: 1px solid var(--line); background: var(--panel-2); border-radius: 9px; padding: 10px 12px; margin-bottom: 9px; }
  .card:last-child { margin-bottom: 0; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .pill.imported { color: var(--info); border-color: color-mix(in srgb, var(--info) 40%, var(--line)); }
  .quote { border-left: 2px solid var(--line); padding-left: 9px; color: var(--muted); }
  .svgwrap { overflow-x: auto; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .timeline { max-height: 380px; overflow: auto; padding-right: 4px; }
  .tl { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .tl:last-child { border-bottom: none; }
  .phase-h { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--dim); margin: 10px 0 2px; }
  .toast { position: fixed; right: 18px; bottom: 18px; z-index: 20; max-width: 480px; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 9px; padding: 10px 13px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35); display: none; }
  .toast.err { border-left-color: var(--bad); }
  .empty { color: var(--dim); font-size: 12.5px; }
  .warnline { color: var(--warn); font-size: 12.5px; } .badline { color: var(--bad); font-size: 12.5px; }
  .okline { color: var(--ok); font-size: 12.5px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  .nosum { font-size: 11.5px; color: var(--dim); margin-top: 7px; font-style: italic; }
  .loading { color: var(--dim); padding: 40px 0; text-align: center; }
  .inbox-progress { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; padding: 0 4px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">ResearchOS <span id="hdr-project"></span></div>
    <div class="switch" id="hdr-switch">
      <button data-view="cockpit">Cockpit</button>
      <button data-view="audit">Audit</button>
    </div>
    <div class="chips" id="hdr-chips"></div>
  </div>
</header>
<main><div id="app"><div class="loading">loading research state…</div></div></main>
<div class="toast" id="toast"></div>

<script>
const ACTIONS_ENABLED = __ACTIONS_ENABLED__;
const state = { view: "cockpit", cockpit: null, audit: null, inbox: null, queue: [], index: 0 };
let REFRESH_TIMER = null;

// ---------------------------------------------------------------- helpers
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shortId = (id) => (id && id.includes("_")) ? id.split("_")[1].slice(-8) : (id || "");
const num = (v, d = 2) => (typeof v === "number" ? v.toFixed(d) : "—");
const pct = (v) => (typeof v === "number" ? Math.round(v * 100) + "%" : "—");
const when = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString(); };
const clip = (s, n) => { const t = String(s ?? ""); return t.length > n ? t.slice(0, n - 1) + "…" : t; };
const barClass = (s) => s >= 0.75 ? "ok" : s >= 0.4 ? "warn" : "bad";
const sevRank = (s) => ({ BLOCKER: 0, HIGH: 1, MEDIUM: 2, LOW: 3, INFO: 4 }[s] ?? 5);

function toast(msg, isError) {
  const el = $("#toast"); el.textContent = msg; el.className = "toast" + (isError ? " err" : "");
  el.style.display = "block"; clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, isError ? 9000 : 5000);
}
function panel(title, count, body, cls = "", extra = "") {
  const c = (count === null || count === undefined) ? "" : ` <span class="count">${esc(count)}</span>`;
  return `<section class="panel ${cls}"><h2>${esc(title)}${c}<span class="spacer"></span>${extra}</h2>${body}</section>`;
}

// ---------------------------------------------------------------- header
function renderHeader() {
  const d = state.audit?.describe ?? {};
  $("#hdr-project").textContent = d.project ? "· " + d.project : "";
  document.querySelectorAll("#hdr-switch button").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  const c = state.cockpit?.counts ?? {};
  const chips = [];
  if (state.view === "cockpit") {
    chips.push(`<span class="chip">phase <b>${esc(state.cockpit?.phase_label || "—")}</b></span>`);
    chips.push(`<span class="chip ${(c.reviews_pending || 0) ? "act" : ""}">needs you <b>${state.cockpit?.attention.length || 0}</b></span>`);
    chips.push(`<span class="chip">claims <b>${c.claims_supported || 0}/${c.claims || 0}</b> supported</span>`);
    chips.push(`<span class="chip">evidence <b>${c.evidence_verified || 0}/${c.evidence || 0}</b> verified</span>`);
  } else {
    const ig = state.audit?.integrity ?? {};
    chips.push(`<span class="chip">rev <b>${esc(d.revision)}</b></span>`);
    chips.push(`<span class="chip ${ig.ok ? "ok" : "bad"}">integrity <b>${ig.ok ? "ok" : (ig.issues || []).length + " issue(s)"}</b></span>`);
    chips.push(`<span class="chip">event head <b>${esc(ig.head || "—")}</b></span>`);
    chips.push(`<span class="chip">records <b>${Object.values(d.counts || {}).reduce((a, b) => a + b, 0)}</b></span>`);
  }
  chips.push(`<span class="chip ${ACTIONS_ENABLED ? "act" : ""}">${ACTIONS_ENABLED ? "actions enabled" : "read-only"}</span>`);
  $("#hdr-chips").innerHTML = chips.join("") + `<button id="refresh">refresh</button><button id="auto">auto</button>`;
  $("#refresh").onclick = () => load(true);
  $("#auto").onclick = () => {
    if (REFRESH_TIMER) { clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; } else { REFRESH_TIMER = setInterval(() => load(false), 30000); }
    $("#auto").classList.toggle("primary", !!REFRESH_TIMER);
  };
  if (REFRESH_TIMER) $("#auto").classList.add("primary");
  document.querySelectorAll("#hdr-switch button").forEach((b) => {
    b.onclick = () => { location.hash = "#/" + b.dataset.view; };
  });
}

// ================================================================ COCKPIT
function layerGlance() {
  const c = state.cockpit;
  const q = c.core_question ? c.core_question : "(no core question recovered)";
  const kindPill = { SUPPORTED: "ok", TESTED: "current", HYPOTHESIS: "pending", NONE: "pending" }[c.current_finding_kind] || "pending";
  return panel(null, null,
    `<div class="glance">
       <div class="label">Research phase</div>
       <div><div class="phase">${esc(c.phase_label)}</div><div class="small muted">${esc(c.phase_reason)}</div></div>
       <div class="label">Core question</div>
       <div class="question">${esc(q)}${c.core_question_confirmed ? "" : ` <span class="st PENDING">unconfirmed</span>`}</div>
       <div class="label">What we know</div>
       <div class="finding">${esc(c.current_finding)}</div>
     </div>`, "wide",
    `<span class="chip ${kindPill}">${esc(c.current_finding_kind)}</span>`);
}

function layerAttention() {
  const actions = state.cockpit.attention || [];
  if (!actions.length) {
    return panel("Needs your attention", 0,
      `<div class="okline">Nothing is blocking this project right now.</div>
       <div class="small muted" style="margin-top:6px">Next natural step: ${esc(nextStep(state.cockpit.phase))}</div>`, "wide");
  }
  const render = (a, top) => {
    const ui = ACTIONS_ENABLED && a.ui_action
      ? `<div class="row" style="margin-top:8px">
           ${a.ui_action === "review.decide" ? `<button class="primary" data-open-inbox="1">Start review</button>` : ""}
           ${a.ui_action === "evidence.verify" ? `<button data-verify-all="1">Verify all on this machine</button>` : ""}
         </div>`
      : `<code class="cmd">${esc(a.command)}</code>`;
    return `<div class="act ${esc(a.severity)} ${top ? "top" : ""}">
      <div class="sev"></div>
      <div class="body">
        <div class="row"><span class="pill">${esc(a.severity)}</span>${a.count ? `<span class="pill">${a.count}</span>` : ""}<h3>${esc(a.title)}</h3></div>
        <div class="why">${esc(a.why)}</div>
        ${a.blocks.length ? `<div class="blocks">blocks: ${esc(a.blocks.join(" · "))}</div>` : ""}
        ${ui}
      </div>
    </div>`;
  };
  const top = actions.slice(0, 3).map((a) => render(a, true)).join("");
  const rest = actions.slice(3);
  return panel("Needs your attention", actions.length,
    `<div class="small muted" style="margin-bottom:9px">The three that matter most right now, then everything else.</div>
     ${top}
     ${rest.length ? `<details style="margin-top:6px"><summary>${rest.length} further item(s)</summary>${rest.map((a) => render(a, false)).join("")}</details>` : ""}`,
    "wide");
}

function nextStep(phase) {
  return ({
    IMPORT_REVIEW: "decide the review queue",
    CONFLICT_RESOLUTION: "resolve the contradictions",
    EVIDENCE_VERIFICATION: "verify evidence against its artifacts",
    LITERATURE_AUDIT: "run a literature search",
    EXPERIMENT_DESIGN: "design the experiment that would test the hypothesis",
    ANALYSIS_PENDING: "compute analysis artifacts from the runs",
    CLAIM_VALIDATION: "assess evidence and promote the claims that hold",
    PAPER_COMPILATION: "compile the paper and clear grounding violations",
    PAPER_READY: "review the compiled paper and release it",
    QUESTION_UNCONFIRMED: "confirm the core research question",
  })[phase] || "keep going";
}

function layerEvidenceToClaims() {
  const k = state.cockpit.knowledge;
  const chain = k.promotion_chain.map((s) => `
    <div class="step ${s.blocked ? "blocked" : "ok"}">
      <div class="dot">${s.blocked ? "!" : "✓"}</div>
      <div><div class="name">${esc(s.step)}</div><div class="note">${esc(s.note)}</div></div>
      <div class="n">${s.count}</div>
    </div>`).join("");
  const byStatus = k.claims_by_status || {};
  const chips = Object.entries(byStatus).filter(([, v]) => v)
    .map(([s, v]) => `<span class="st ${esc(s)}">${esc(s)} ${v}</span>`).join(" ");
  const funnel = (k.evidence_funnel || []).filter((f) => f.count)
    .map((f) => `<span class="pill">${esc(f.stage)} ${f.count}</span>`).join(" ");
  return panel("Evidence → claims", null,
    `<div class="chain">${chain}</div>
     <h2 style="margin-top:15px">Claims by status</h2><div class="row">${chips || `<span class="empty">no claims</span>`}</div>
     <h2 style="margin-top:15px">Evidence by maturity</h2><div class="row">${funnel || `<span class="empty">no evidence</span>`}</div>
     <div class="nosum">A claim moves up only when the rung below it is complete: HYPOTHESIS → TESTED (needs an experiment) → SUPPORTED (needs verified L2+ evidence and an analysis artifact, approved by a human).</div>`,
    "two-thirds");
}

function layerGates() {
  const gates = state.cockpit.gates || [];
  const rows = gates.map((g) => `
    <div class="step ${g.status === "done" ? "ok" : g.status === "current" ? "" : ""}">
      <div class="dot">${g.status === "done" ? "✓" : g.status === "current" ? "→" : "·"}</div>
      <div><div class="name">${esc(g.label)}</div><div class="note">${esc(g.detail)}</div></div>
      <div class="n tiny muted">${esc(g.status)}</div>
    </div>`).join("");
  return panel("Where the project is in its own process", null,
    `<div class="chain">${rows}</div>
     <div class="nosum">The research state machine, read from records: reconstruct → review → resolve → verify → literature → analyse → promote → compile.</div>`, "third");
}

function layerMap() {
  const map = state.cockpit.research_map;
  const nodes = map.nodes, edges = map.edges;
  const byId = {}; nodes.forEach((n) => byId[n.node_id] = n);
  const layers = [[], [], []];
  nodes.forEach((n) => layers[Math.min(n.depth || 1, 2)].push(n));
  layers.forEach((l) => l.sort((a, b) => (a.kind + a.label).localeCompare(b.kind + b.label)));
  const W = Math.max(900, layers[1].length * 160);
  const NW = 152, NH = 54, GAPY = 130, TOP = 24;
  const pos = {};
  layers.forEach((layer, li) => {
    const step = (W - 40) / Math.max(layer.length, 1);
    layer.forEach((n, i) => { pos[n.node_id] = { x: 20 + step * (i + 0.5), y: TOP + li * GAPY }; });
  });
  const H = TOP + (layers.length - 1) * GAPY + NH + 26;
  const fill = (n) => {
    if (n.kind === "QUESTION") return "var(--accent)";
    if (n.kind === "EXPERIMENT") return "var(--info)";
    if (n.kind === "REJECTED") return "var(--rejected)";
    if (n.kind === "OPEN_QUESTION") return "var(--tested)";
    return n.status === "SUPPORTED" || n.status === "ROBUST" ? "var(--supported)" : "var(--hyp)";
  };
  const edgeSvg = edges.map((e) => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return "";
    const dashed = e.relation === "BELONGS_TO" || e.relation === "SAME_SOURCE";
    const mid = (a.y + b.y) / 2;
    const colour = e.relation === "CONTRADICTS" ? "var(--rejected)"
      : e.relation === "SAME_SOURCE" ? "var(--dim)"
      : e.relation === "BELONGS_TO" ? "var(--line)" : "var(--accent)";
    return `<path d="M ${a.x} ${a.y + NH / 2} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y - NH / 2}"
      fill="none" stroke="${colour}" stroke-width="1.2" ${dashed ? 'stroke-dasharray="4 4"' : ""}/>
      <title>${esc(e.relation)}</title>`;
  }).join("");
  const nodeSvg = nodes.map((n) => {
    const p = pos[n.node_id]; if (!p) return "";
    const label = clip(n.label, 30).replace(/\n/g, " ");
    return `<g>
      <title>${esc(n.label + (n.detail ? "\n" + n.detail : "") + "\nstatus: " + n.status)}</title>
      <rect x="${p.x - NW / 2}" y="${p.y - NH / 2}" rx="9" width="${NW}" height="${NH}"
        fill="var(--panel-2)" stroke="${fill(n)}" stroke-width="1.4"/>
      <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" fill="var(--fg)" font-size="11.5">${esc(label)}</text>
      <text x="${p.x}" y="${p.y + 8}" text-anchor="middle" fill="${fill(n)}" font-size="10">${esc(n.kind.toLowerCase().replace("_", " "))}</text>
      <text x="${p.x}" y="${p.y + 21}" text-anchor="middle" fill="var(--dim)" font-size="9.5">${esc(clip(n.status, 22))}</text>
    </g>`;
  }).join("");
  const legend = [["question", "var(--accent)"], ["claim", "var(--hyp)"], ["experiment", "var(--info)"],
    ["rejected", "var(--rejected)"], ["open question", "var(--tested)"]]
    .map(([t, c]) => `<span class="pill" style="border-color:${c};color:${c}">${t}</span>`).join(" ");
  const rels = edges.filter((e) => e.relation !== "BELONGS_TO")
    .map((e) => `<li><span class="mono tiny">${esc(e.relation)}</span> ${esc(clip(byId[e.source]?.label || e.source, 40))} → ${esc(clip(byId[e.target]?.label || e.target, 40))}</li>`).join("");
  return panel("Research map", `${nodes.length} nodes`, `
    <div class="svgwrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${Math.min(H, 460)}" role="img"
      aria-label="Research structure: core question, claims, experiments and open questions">${edgeSvg}${nodeSvg}</svg></div>
    <div class="row" style="margin-top:6px">${legend}</div>
    ${rels ? `<details style="margin-top:8px"><summary>relations (${edges.length - (edges.length - rels.length)})</summary><ul class="small">${rels}</ul></details>` : ""}
    <div class="nosum">${esc(map.note)}${map.unlinked.length ? ` Unlinked: ${esc(map.unlinked.join(", "))}` : ""}</div>`, "wide");
}

function auditTimeline() {
  const t = state.audit.timeline || {};
  const phases = [["observation", ["PROJECT_CREATED", "IMPORT", "IDEA", "LITERATURE"]],
    ["hypothesis", ["TASK_CREATED", "FINDING"]],
    ["experiment", ["EXPERIMENT_REGISTERED", "EXPERIMENT_STARTED", "EXPERIMENT_RESULT", "EXPERIMENT_FAILED", "ANOMALY"]],
    ["analysis", ["ANALYSIS", "EVIDENCE", "VERIFICATION"]],
    ["revision", ["AUDIT", "CLAIM_REVISION", "CLAIM_REJECTED", "STATE_TRANSITION", "DECISION"]],
    ["claim", ["CLAIM_CREATED", "SKILL"]], ["paper", ["PAPER"]]];
  const events = t.events || []; const seen = new Set(); let html = "";
  for (const [phase, kinds] of phases) {
    const bucket = events.filter((e) => kinds.includes(e.kind));
    bucket.forEach((e) => seen.add(e.event_id));
    if (!bucket.length) continue;
    html += `<div class="phase-h">${esc(phase)} (${bucket.length})</div>` + bucket.slice(0, 12).map((e) => `
      <div class="tl"><div class="tiny muted">${esc(when(e.at).split(",")[0])}</div>
        <div class="small">${esc(clip(e.title, 96))} ${e.imported ? `<span class="pill imported">imported</span>` : ""}
        <div class="tiny dim">${esc(e.kind)} · ${esc(e.actor)}</div></div></div>`).join("");
  }
  const rest = events.filter((e) => !seen.has(e.event_id));
  if (rest.length) html += `<div class="phase-h">other (${rest.length})</div>` + rest.slice(0, 8).map((e) => `<div class="tl"><div class="tiny muted">${esc(when(e.at).split(",")[0])}</div><div class="small">${esc(clip(e.title, 90))}</div></div>`).join("");
  return panel("Research timeline", (t.summary || {}).events || events.length,
    `<div class="timeline">${html || `<div class="empty">no events</div>`}</div>`, "two-thirds");
}

// ================================================================ actions
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const p = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(p.detail || ("HTTP " + r.status));
  return p;
}

async function decide(item, decision, note = "") {
  const result = await post("/actions/review/decide", { review_item_id: item.review_item_id, decision, note });
  toast(`review ${shortId(item.review_item_id)} → ${result.status}`);
  state.queue = state.queue.filter((x) => x.review_item_id !== item.review_item_id);
  if (state.index >= state.queue.length) state.index = Math.max(0, state.queue.length - 1);
  await load(false);
  return result;
}

function wire() {
  document.querySelectorAll("[data-open-inbox]").forEach((b) => {
    b.onclick = () => {
      state.queue = (state.audit?.reviews || []).slice();
      state.index = 0;
      state.inbox = true;
      render();
    };
  });
  document.querySelectorAll("[data-verify-all]").forEach((b) => {
    b.onclick = async () => {
      const ids = ((state.cockpit.attention.find((a) => a.kind === "VERIFY_EVIDENCE") || {}).refs) || [];
      b.disabled = true;
      let done = 0, failed = 0;
      for (const id of ids) {
        try { await post("/actions/evidence/verify", { evidence_id: id }); done++; } catch { failed++; }
      }
      toast(`verified ${done} evidence record(s)${failed ? `, ${failed} refused` : ""}`, failed > 0);
      await load(false);
    };
  });
  document.querySelectorAll("[data-decide]").forEach((b) => {
    b.onclick = async () => {
      const item = state.inbox ? state.queue[Math.min(state.index, state.queue.length - 1)]
        : (state.audit.reviews || []).find((r) => r.review_item_id === b.dataset.id);
      if (!item) return;
      const decision = b.dataset.decide;
      const note = decision === "REJECTED" ? (prompt("Why is this rejected? (recorded as the decision note)") || "rejected") : "";
      b.disabled = true;
      try { await decide(item, decision, note); } catch (e) { toast("action refused: " + e.message, true); b.disabled = false; }
    };
  });
  document.querySelectorAll("[data-skip]").forEach((b) => {
    b.onclick = () => { state.index = Math.min(state.index + 1, Math.max(0, state.queue.length - 1)); render(); };
  });
  document.querySelectorAll("[data-close-inbox]").forEach((b) => {
    b.onclick = () => { state.inbox = false; render(); };
  });
}

// ================================================================ render
function renderCockpit() {
  const html = [
    layerGlance(),
    state.inbox ? renderInbox() : layerAttention(),
    layerEvidenceToClaims(),
    layerReadiness(),
    layerMap(),
    layerGates(),
    layerSystemSummary(),
  ].join("");
  $("#app").innerHTML = `<div class="grid">${html}</div>`;
  wire();
}

function renderAudit() {
  const html = [
    auditClaims(),
    auditConflicts(),
    auditEvidence(),
    auditRejected(),
    auditLiterature(),
    auditRest(),
    auditReviews(),
    auditTimeline(),
  ].join("");
  $("#app").innerHTML = `<div class="grid">${html}</div>`;
  wire();
}

function render() {
  renderHeader();
  if (state.view === "cockpit") renderCockpit(); else renderAudit();
}

async function load(showErrors) {
  try {
    const [cockpit, audit] = await Promise.all([
      fetch("/cockpit").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
      fetch("/dashboard").then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
    ]);
    state.cockpit = cockpit; state.audit = audit;
    if (!state.inbox) state.queue = (audit.reviews || []).slice();
    render();
  } catch (e) {
    if (showErrors) toast("could not load research state: " + e.message, true);
    const app = $("#app");
    if (app && app.querySelector(".loading")) {
      app.innerHTML = `<div class="panel wide"><h2>Dashboard unavailable</h2>
        <div class="small muted">The API answered with an error. Check that the project has a valid
        <span class="mono">.researchos/</span> directory and that the server was started for the right root.</div>
        <code class="cmd">researchos api --root &lt;project&gt; --port 8765</code></div>`;
    }
  }
}

function routeFromHash() {
  const hash = (location.hash || "").replace("#/", "");
  return hash === "audit" ? "audit" : "cockpit";
}
window.addEventListener("hashchange", () => { state.view = routeFromHash(); state.inbox = false; render(); });

document.addEventListener("keydown", (e) => {
  if (!state.inbox || !ACTIONS_ENABLED) return;
  const item = state.queue[Math.min(state.index, state.queue.length - 1)];
  if (!item) return;
  if (e.key === "a") document.querySelector('[data-decide="ACCEPTED"]')?.click();
  else if (e.key === "r") document.querySelector('[data-decide="REJECTED"]')?.click();
  else if (e.key === "d") document.querySelector('[data-decide="DEFERRED"]')?.click();
  else if (e.key === "s") document.querySelector("[data-skip]")?.click();
  else if (e.key === "Escape") { state.inbox = false; render(); }
});

state.view = routeFromHash();
if (ACTIONS_ENABLED) {
  fetch("/actions/status").then((r) => r.json()).then((s) => { if (s?.enabled) toast("human actions enabled: decisions run as the human principal"); }).catch(() => {});
}
load(true);
</script>
</body>
</html>
